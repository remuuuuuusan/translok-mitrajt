<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administrasi Translok Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,700&family=Arimo:wght@400;700&display=swap">
<style>

:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --fg: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --line-in: #cbd5e1;
  --accent: #ea580c;
  --accent-dark: #c2410c;
  --accent-fg: #ffffff;
  --accent-soft: #fff7ed;
  --accent-ring: #f97316;
  --warn: #b91c1c;
  --paper: #ffffff;
  --ink: #000000;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .10);
  --font-ui: "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", Roboto, Arial, sans-serif;
  --font-doc: "Tinos", "Times New Roman", Times, serif;
  --font-sans: "Arimo", Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  margin: 0; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 80rem; margin: 0 auto; padding: 28px 16px 56px; }
h1 { font-size: 1.5rem; margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; color: #0f172a; }
.sub { color: var(--muted); font-size: .9rem; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
form.card { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: .875rem; font-weight: 500; color: #334155; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
select, input[type=text], input[type=date], input[type=search], textarea {
  font: inherit; font-size: .875rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line-in); border-radius: 8px;
  padding: 10px 14px; width: 100%; min-width: 0; transition: box-shadow .15s, border-color .15s;
}
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent-ring); box-shadow: 0 0 0 2px var(--accent-ring); }
button:focus-visible, summary:focus-visible, .pick label:focus-within, a:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 1px; }
textarea { resize: vertical; min-height: 56px; }
.custom { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px; }
.nomor { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--font-doc); font-size: 1.05rem; }
.nomor input { width: 6.5rem; font-family: var(--font-ui); font-variant-numeric: tabular-nums; font-weight: 600; }
.hint { color: var(--muted); font-size: .82rem; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .88rem; color: var(--muted); }
.check input { margin-top: 3px; }
.pick { border: 1px solid var(--line-in); border-radius: 8px; overflow: hidden; }
.pick input[type=search] { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
.pick .list { max-height: 240px; overflow-y: auto; }
.pick label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
.pick label:last-child { border-bottom: 0; }
.pick label:hover { background: var(--accent-soft); }
.pick .nm { font-weight: 500; }
.pick .jb { display: block; font-size: .8rem; color: var(--muted); }
.pick .none { padding: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: .85rem; background: var(--surface); }
.chip.on { background: var(--accent-soft); border-color: #fdba74; color: #9a3412; }
.chip button { all: unset; cursor: pointer; padding: 0 6px; color: var(--muted); font-size: 1rem; line-height: 1.2; border-radius: 4px; }
.chip button:hover { color: var(--fg); }
.chip .nmb { all: unset; cursor: pointer; }
.chip .nmb:focus-visible, .chip button:focus-visible { outline: 2px solid var(--accent); }
details.set { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
details.set summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
details.set .inner { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.actions { display: flex; flex-direction: column; gap: 8px; }
button.primary {
  font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px;
  padding: 12px 18px; cursor: pointer; box-shadow: 0 1px 2px rgba(15,23,42,.1); transition: background .15s;
}
button.primary:hover:not(:disabled) { background: var(--accent-dark); }
button.primary:disabled { opacity: .5; cursor: not-allowed; }
.status { min-height: 1.3em; font-size: .88rem; color: var(--muted); }
.status.err { color: var(--warn); }
aside { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
@media (max-width: 860px) { aside { position: static; } }
.pv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sheet { position: relative; width: 100%; background: var(--paper); box-shadow: var(--shadow); overflow: hidden; border-radius: 2px; }
.page { position: absolute; left: 0; top: 0; width: 595.5px; height: 842px; transform-origin: 0 0; background: var(--paper); color: var(--ink); font-family: var(--font-doc); }
.page span { position: absolute; white-space: pre; color: var(--ink); }
.page .blue { color: #006fc0; }
.page .rule { position: absolute; background: var(--ink); }
.page img { position: absolute; max-width: none; }
.sigslot { position: absolute; border: 1px dashed #9aa6b4; color: #7d8895; font-family: var(--font-ui); font-size: 7.5px; display: flex; align-items: center; justify-content: center; text-align: center; }
.note { font-size: .82rem; color: var(--muted); }
.tpl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tpl input[type=file] { font: inherit; font-size: .88rem; color: var(--fg); max-width: 100%; min-width: 0; }
button.ghost { font: inherit; font-size: .85rem; font-weight: 500; background: #fff; color: #334155; border: 1px solid var(--line-in); border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: border-color .15s, color .15s; }
button.ghost:hover { border-color: #fdba74; color: var(--accent); }
.hint.err { color: var(--warn); }

/* kerangka, sesuai template LAPOR KENDALA-JT */
.site-top { position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid var(--line); }
.site-top .in { max-width: 80rem; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-align: left; }
.brand img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; }
.brand strong { display: block; font-size: 1rem; line-height: 1.2; color: #0f172a; }
.brand small { display: block; font-size: 11px; line-height: 1.2; color: var(--muted); }
@media (max-width: 520px) { .brand small { display: none; } .brand strong { font-size: .875rem; } }
.site-top .right { display: flex; align-items: center; gap: 8px; }
.btn-top { font: inherit; font-size: .875rem; font-weight: 600; text-decoration: none; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(15,23,42,.1); }
.btn-top:hover { background: var(--accent-dark); }
a.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: .875rem; text-decoration: none; margin-bottom: 12px; }
a.back:hover { color: var(--accent); }
.pagehead { margin-bottom: 18px; }
.pagehead .sub { margin: 4px 0 0; }
.sub { color: var(--muted); font-size: .9rem; }
/* halaman depan */
.hero { text-align: center; padding-block: 40px 28px; }
.pill { display: inline-block; font-size: .75rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: 20px; }
.hero h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 800; line-height: 1.15; max-width: 48rem; margin: 0 auto; letter-spacing: -.02em; }
.hero p { color: var(--muted); font-size: 1.05rem; max-width: 40rem; margin: 18px auto 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 36px auto 0; max-width: 46rem; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
.stat b { display: block; font-size: 1.9rem; font-weight: 800; color: #0f172a; line-height: 1.1; }
.stat b.o { color: var(--accent); }
.stat span { font-size: .8rem; color: var(--muted); }
.band { background: #fff; border-block: 1px solid var(--line); padding: 44px 0; margin-block: 28px; }
.band h2, .sect h2 { text-align: center; font-size: 1.4rem; font-weight: 700; margin: 0; color: #0f172a; }
.band .lead, .sect .lead { text-align: center; color: var(--muted); font-size: .875rem; margin: 6px 0 0; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-top: 30px; }
.step { text-align: center; }
.step i { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-style: normal; margin: 0 auto 10px; }
.step strong { display: block; font-size: .875rem; color: #1e293b; }
.step span { font-size: .75rem; color: var(--muted); }
.sect { padding-block: 8px 24px; }
.card h2 { text-align: left; font-size: 1.05rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 26px; }
a.doc { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--fg); transition: border-color .15s, box-shadow .15s, transform .15s; }
a.doc:hover { border-color: #fdba74; box-shadow: 0 6px 18px rgba(234, 88, 12, .10); transform: translateY(-1px); }
a.doc strong { font-size: 1rem; color: #0f172a; }
a.doc .open { color: var(--accent); font-weight: 600; font-size: .875rem; margin-top: 4px; }
.foot { background: #fff; border-top: 1px solid var(--line); padding: 22px 16px; text-align: center; font-size: .75rem; color: #94a3b8; }
.fade-in { animation: fadeIn .25s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

</style>
</head>
<body>
<header class="site-top"><div class="in">
  <a class="brand" id="brand" href="#"><img id="brandLogo" alt="Logo BPS" width="40" height="40"><span><strong id="brandTitle">Generator Dokumen</strong><small id="brandSub">BPS Kota Jakarta Timur</small></span></a>
  <div class="right"><a class="btn-top" id="topBtn" href="#docs">Pilih Dokumen</a></div>
</div></header>
<div id="app"></div>
<footer class="foot" id="foot">BPS Kota Jakarta Timur &copy; 2026</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* Bagian bersama untuk semua dokumen. Jangan ubah kecuali perlu.
   Dokumen baru cukup menambah satu file di js/docs/ (lihat PANDUAN-TAMBAH-DOKUMEN.md). */
(function () {
  "use strict";
  var Core = (window.Core = { docs: [], BULAN: ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"],
    HARI: ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"] });
  var A = Array.prototype;

  /* ---------- util ---------- */
  var $ = (Core.$ = function (id) { return document.getElementById(id); });
  Core.el = function (tag, props, kids) {
    var e = document.createElement(tag); props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (c) { e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  };
  var el = Core.el;
  Core.store = {
    get: function (k, d) { try { var v = localStorage.getItem("gd-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("gd-" + k, JSON.stringify(v)); } catch (e) { /* abaikan */ } },
    del: function (k) { try { localStorage.removeItem("gd-" + k); } catch (e) { /* abaikan */ } }
  };
  function pad(n) { return String(n).padStart(2, "0"); }
  Core.todayISO = function () { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  Core.fmtDate = function (s) { if (!s) return ""; var p = s.split("-"); return p[2] + " " + Core.BULAN[+p[1] - 1] + " " + p[0]; };
  Core.hari = function (iso) { if (!iso) return ""; var p = iso.split("-"); return Core.HARI[new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; };
  Core.addDays = function (iso, n) { var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  Core.diffDays = function (a, b) { var x = a.split("-"), y = b.split("-"); return Math.round((new Date(+y[0], +y[1] - 1, +y[2]) - new Date(+x[0], +x[1] - 1, +x[2])) / 864e5); };
  // terima "2026-09-17", "17 September 2026", "17/09/2026", atau nomor seri Excel
  Core.parseDate = function (v) {
    v = String(v == null ? "" : v).trim(); if (!v) return "";
    if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    if (/^\d{5}(\.\d+)?$/.test(v)) return new Date(Date.UTC(1899, 11, 30) + Math.floor(+v) * 864e5).toISOString().slice(0, 10);
    var m = /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/.exec(v);
    if (m) { var i = Core.BULAN.map(function (b) { return b.toLowerCase(); }).indexOf(m[2].toLowerCase()); if (i >= 0) return m[3] + "-" + pad(i + 1) + "-" + pad(m[1]); }
    m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(v);
    return m ? m[3] + "-" + pad(m[2]) + "-" + pad(m[1]) : "";
  };
  Core.uniq = function (list) { var seen = {}; return list.filter(function (v) { if (!v || seen[v]) return false; seen[v] = 1; return true; }); };
  Core.firstWord = function (s) { return String(s || "").split(/\s+/)[0].replace(/[^A-Za-z]/g, "").toUpperCase(); };
  var firstWord = Core.firstWord;
  Core.rupiah = function (n) { return "RP. " + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + ", -"; };
  function tb(n) {
    var s = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
    if (n < 12) return s[n];
    if (n < 20) return tb(n - 10) + " belas";
    if (n < 100) return tb(Math.floor(n / 10)) + " puluh" + (n % 10 ? " " + tb(n % 10) : "");
    if (n < 200) return "seratus" + (n > 100 ? " " + tb(n - 100) : "");
    if (n < 1000) return tb(Math.floor(n / 100)) + " ratus" + (n % 100 ? " " + tb(n % 100) : "");
    if (n < 2000) return "seribu" + (n > 1000 ? " " + tb(n - 1000) : "");
    if (n < 1e6) return tb(Math.floor(n / 1000)) + " ribu" + (n % 1000 ? " " + tb(n % 1000) : "");
    if (n < 1e9) return tb(Math.floor(n / 1e6)) + " juta" + (n % 1e6 ? " " + tb(n % 1e6) : "");
    return tb(Math.floor(n / 1e9)) + " miliar" + (n % 1e9 ? " " + tb(n % 1e9) : "");
  }
  Core.terbilang = function (n) { n = Math.round(n); if (n <= 0) return "Nol rupiah"; var t = tb(n); return t.charAt(0).toUpperCase() + t.slice(1) + " rupiah"; };

  /* ---------- baca Excel (.xlsx) ---------- */
  function colIdx(ref) { var m = /^([A-Z]+)/.exec(ref || ""), n = 0; if (!m) return 0; for (var i = 0; i < m[1].length; i++) n = n * 26 + m[1].charCodeAt(i) - 64; return n - 1; }
  Core.excel = {
    // hasil: [{name, rows:[[sel,sel,...],...]}]
    read: async function (buf) {
      var z = await JSZip.loadAsync(buf), dp = new DOMParser();
      async function xml(p) { var f = z.file(p); return f ? dp.parseFromString(await f.async("string"), "application/xml") : null; }
      var ss = [], sd = await xml("xl/sharedStrings.xml");
      if (sd) A.forEach.call(sd.getElementsByTagName("si"), function (si) { ss.push(A.map.call(si.getElementsByTagName("t"), function (t) { return t.textContent; }).join("")); });
      var wb = await xml("xl/workbook.xml"), rl = await xml("xl/_rels/workbook.xml.rels");
      if (!wb || !rl) throw new Error("Bukan file .xlsx yang valid.");
      var map = {}; A.forEach.call(rl.getElementsByTagName("Relationship"), function (r) { map[r.getAttribute("Id")] = r.getAttribute("Target"); });
      var out = [], sheets = A.slice.call(wb.getElementsByTagName("sheet"));
      for (var s = 0; s < sheets.length; s++) {
        var sh = sheets[s], rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
        var tg = map[rid]; if (!tg) continue;
        var doc = await xml(tg.charAt(0) === "/" ? tg.slice(1) : "xl/" + tg), rows = [];
        if (!doc) continue;
        A.forEach.call(doc.getElementsByTagName("row"), function (row) {
          var arr = [];
          A.forEach.call(row.getElementsByTagName("c"), function (c) {
            var t = c.getAttribute("t"), v = "";
            if (t === "inlineStr") v = A.map.call(c.getElementsByTagName("t"), function (x) { return x.textContent; }).join("");
            else { var ve = c.getElementsByTagName("v")[0]; v = ve ? ve.textContent : ""; if (t === "s") v = ss[+v] || ""; }
            arr[colIdx(c.getAttribute("r"))] = v;
          });
          rows.push(arr);
        });
        out.push({ name: sh.getAttribute("name") || "", rows: rows });
      }
      return out;
    },
    sheet: function (sheets, re) { return sheets.filter(function (s) { return re.test(s.name); })[0]; },
    // peta judul kolom -> nomor kolom pada sebuah sheet (judul di baris pertama, huruf kecil)
    header: function (sheet) {
      var h = {}; (sheet.rows[0] || []).forEach(function (t, i) { var k = String(t || "").trim().toLowerCase().replace(/\s+/g, " "); if (k && !(k in h)) h[k] = i; });
      return h;
    },
    // cari kolom: kembalikan nomor kolom pertama yang judulnya memuat salah satu kata
    col: function (h, words) { for (var k in h) for (var i = 0; i < words.length; i++) if (k.indexOf(words[i]) >= 0) return h[k]; return -1; }
  };

  /* ---------- pegawai (dipakai semua dokumen) ---------- */
  var staffListeners = [];
  Core.staff = {
    list: [], info: "", custom: false, defaults: [],
    setDefaults: function (l) { this.defaults = l; if (!this.custom && !this.list.length) this.list = l; },
    find: function (key) { return this.list.filter(function (s) { return s[0] === key; })[0]; },
    onChange: function (fn) { staffListeners.push(fn); return function () { staffListeners = staffListeners.filter(function (f) { return f !== fn; }); }; },
    set: function (list, info, custom) { this.list = list; this.info = info; this.custom = custom; staffListeners.slice().forEach(function (f) { f(); }); },
    fromSheets: function (sheets) {
      var ref = Core.excel.sheet(sheets, /referensi|pegawai/i);
      if (!ref) throw new Error('Tidak ada sheet "Referensi Pegawai".');
      var staff = [], seen = {};
      ref.rows.forEach(function (r) { var k = String(r[0] || "").trim(); if (k && !seen[k]) { seen[k] = 1; staff.push([k, String(r[1] || k).trim(), String(r[2] || "").trim()]); } });
      if (!staff.length) throw new Error("Sheet Referensi Pegawai kosong.");
      return staff;
    },
    init: function () {
      var st = Core.store.get("pegawai", null);
      if (st && st.list && st.list.length) { this.list = st.list; this.info = st.info; this.custom = true; }
      else { this.list = this.defaults; this.info = "Memakai data pegawai bawaan (" + this.defaults.length + " orang)."; this.custom = false; }
    },
    useDefaults: function () { Core.store.del("pegawai"); this.set(this.defaults, "Memakai data pegawai bawaan (" + this.defaults.length + " orang).", false); },
    loadFile: async function (file) {
